[project]
name = "datchat"
version = "0.1.0"
description = "Conversational explorer for Dutch statistics, backed by a local DuckDB cache of CBS StatLine."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "marimo>=0.25.0",
    "pandas>=2.2",
    "plotly>=7.1.0",
]

[project.scripts]
datchat = "datchat.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real CBS API (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# marimo cells end with a bare expression to display it; markdown/SQL cells have long lines
"notebooks/**" = ["B018", "E501"]
".claude/skills/**/template.py" = ["B018", "E501"]
